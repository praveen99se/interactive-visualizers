<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Visualizers - Learn Cloud, Networking & Algorithms</title>
    <meta name="description" content="Interactive educational visualizers for cloud concepts, networking, algorithms, and data structures." />

    <!-- Start Single Page Apps for GitHub Pages Redirect Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search.indexOf('p=') !== -1) {
          var pairs = l.search.slice(1).split('&');
          var pValue = '';
          for (var i = 0; i < pairs.length; i++) {
            var parts = pairs[i].split('=');
            if (parts[0] === 'p') {
              pValue = decodeURIComponent(parts[1].replace(/~and~/g, '&'));
              break;
            }
          }
          if (pValue) {
            var cleanPath = l.pathname;
            if (cleanPath.slice(-1) !== '/') {
              cleanPath += '/';
            }
            if (pValue.charAt(0) === '/') {
              pValue = pValue.slice(1);
            }
            window.history.replaceState(null, null, cleanPath + pValue + l.hash);
          }
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages Redirect Handler -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
